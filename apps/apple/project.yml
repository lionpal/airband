name: Airband
options:
  bundleIdPrefix: dev.airband
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 6LYK439Z4F
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "29"
targets:
  Airband:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - Sources
      - Resources
      - path: Generated/airband_radio.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.airband.app
        PRODUCT_NAME: Airband
        SWIFT_INCLUDE_PATHS: $(PROJECT_DIR)/Generated
        HEADER_SEARCH_PATHS: $(PROJECT_DIR)/Generated
        LIBRARY_SEARCH_PATHS: $(PROJECT_DIR)/../../target/aarch64-apple-ios/release
        # The Rust core is linked INTO the app, as a static library named by its whole path. Asked for by name
        # (-lairband_radio) the linker prefers the dynamic library beside it, which stays on the build machine:
        # the app then starts in the simulator and nowhere else.
        AIRBAND_CORE[sdk=iphoneos*]: $(PROJECT_DIR)/../../target/aarch64-apple-ios/release/libairband_radio.a
        AIRBAND_CORE[sdk=iphonesimulator*]: $(PROJECT_DIR)/../../target/aarch64-apple-ios-sim/release/libairband_radio.a
        OTHER_LDFLAGS: $(AIRBAND_CORE)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: airband
        CFBundleIconName: AppIcon
        LSRequiresIPhoneOS: true
        # The answer given in App Store Connect on 2026-11-18 (standard algorithms only; not distributed in France)
        # came out as "no non-exempt encryption". Stated here so each new build does not ask again. If the app is
        # ever offered in France, or the answer changes, change this with it.
        ITSAppUsesNonExemptEncryption: false
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSMicrophoneUsageDescription: Airband listens for your reply after an agent speaks, and when you press Talk.
        NSSpeechRecognitionUsageDescription: Airband turns what you say into text, on this phone, to send to your agents.
        NSLocalNetworkUsageDescription: Airband reaches the tower running on your computer.
        NSCameraUsageDescription: airband uses the camera to scan the pairing code your computer shows.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: dev.airband.pair
            CFBundleURLSchemes: [airband]
