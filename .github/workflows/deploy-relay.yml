name: Deploy relay.airband.dev
# Every push to main that could change the relay ships it to its server (AirbandRelayUs in infra/cdk.mjs). Only
# those. What the relay is built from is not a list kept here: the first job builds it and asks cargo what that
# build read (scripts/relay-sources.py: the relay's crate and every crate of ours it depends on, their files, what
# their build scripts read, such as the catalogue the core compiles in, and the manifests), and the deploy runs
# only when what changed since the last relay that was deployed and answered touched one of those, the
# infrastructure (infra/) or this file. It can also be run by hand (Actions tab, "Run workflow"), which always deploys.
#
# The last deployed commit is recorded by the deploy itself, as the tag `relay-deployed`, and only once the live
# relay answers. Nothing else moves it. So the comparison is never just this push's own: a push whose run GitHub
# cancelled while it waited behind another (one group, one run waiting, the older waiting run is dropped), or whose
# deploy failed, is still in the difference the next run sees, and that run deploys it.
#
# What a deploy does: builds the relay for Linux on arm64 as one static file, brings the infrastructure up to
# date, puts the relay and the files in infra/host/ in the server's bucket, and asks the server to fetch them and
# run setup.sh. The relay is off the air for the few seconds its restart takes; towers and phones try again.
# No SSH and no keys: the server is asked through SSM, by a role that can ask it for this one thing.
#
# The same by hand, with the `aws` command set up for the account:
#   cargo zigbuild --release -p airband-relay --target aarch64-unknown-linux-musl     (pip install cargo-zigbuild)
#   mkdir pack && cp target/aarch64-unknown-linux-musl/release/airband-relay infra/host/* pack/ && tar -czf relay.tar.gz -C pack .
#   aws s3 cp relay.tar.gz s3://airband-relay-ship-<account>-us-east-2/relay/relay.tar.gz
#   aws ssm send-command --region us-east-2 --document-name airband-relay-deploy --targets Key=tag:Name,Values=airband-relay
#
# The relay that ran in Tokyo before (AirbandRelay) is still defined and is deployed only when asked for by hand.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tokyo:
        description: 'Deploy the old relay in Tokyo instead (a minute off the air for anyone still using it)'
        type: boolean
        default: false
# a running deploy is never cancelled; a waiting run GitHub drops loses nothing (above)
concurrency: { group: deploy-relay, cancel-in-progress: false }
permissions: { id-token: write, contents: read }
env: { REGION: us-east-2 }
jobs:
  changed:
    name: Did this push change what the relay is made from
    if: ${{ !inputs.tokyo }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      relay: ${{ steps.made.outputs.relay }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
      - name: What the relay is built from, by cargo, against what changed
        id: made
        env: { EVENT: '${{ github.event_name }}' }
        run: |
          python3 scripts/relay-sources.py --self-test
          # by hand: always
          if [ "$EVENT" != push ]; then echo "relay=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # the last relay deployed and answering, as the deploy recorded it; `--exit-code` says 2 when there is none
          set +e; git ls-remote --exit-code --tags origin refs/tags/relay-deployed > /dev/null; there=$?; set -e
          if [ "$there" = 2 ]; then echo "no deploy recorded yet"; echo "relay=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          [ "$there" = 0 ]
          git fetch --no-tags --force origin refs/tags/relay-deployed:refs/tags/relay-deployed
          echo "relay=$(python3 scripts/relay-sources.py --since-deployed relay-deployed HEAD)" >> "$GITHUB_OUTPUT"
  deploy:
    needs: changed
    if: ${{ !inputs.tokyo && needs.changed.outputs.relay == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # contents: write only to move the tag that records what is deployed
    permissions: { id-token: write, contents: write }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-unknown-linux-musl }
      - name: Test the core and the relay here, so a broken build fails before anything is deployed
        run: cargo test -p airband-core -p airband-relay
      - name: Build the relay for the server (arm64, one static file)
        run: |
          pip install --quiet cargo-zigbuild
          cargo zigbuild --release -p airband-relay --target aarch64-unknown-linux-musl
          mkdir pack && cp target/aarch64-unknown-linux-musl/release/airband-relay infra/host/* pack/
          tar -czf relay.tar.gz -C pack .
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: aws-actions/configure-aws-credentials@v4
        with: { role-to-assume: '${{ vars.AWS_DEPLOY_ROLE_ARN }}', aws-region: '${{ env.REGION }}' }
      - name: Bring the infrastructure up to date
        working-directory: infra
        env: { AIRBAND_INFRA: '${{ secrets.AIRBAND_INFRA }}', AIRBAND_APNS: '${{ vars.AIRBAND_APNS }}' }
        run: npm ci --no-audit --no-fund && npx cdk deploy AirbandRelayUs --require-approval never
      - name: The role that ships (in the same account as the one that deploys)
        id: ship
        env: { DEPLOY_ROLE: '${{ vars.AWS_DEPLOY_ROLE_ARN }}' }
        run: |
          echo "role=${DEPLOY_ROLE%/*}/airband-relay-us-deploy" >> "$GITHUB_OUTPUT"
          echo "bucket=airband-relay-ship-$(aws sts get-caller-identity --query Account --output text)-$REGION" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v4
        with: { role-to-assume: '${{ steps.ship.outputs.role }}', aws-region: '${{ env.REGION }}', unset-current-credentials: true }
      - name: Ship it and have the server put it in service
        run: |
          aws s3 cp --only-show-errors relay.tar.gz "s3://${{ steps.ship.outputs.bucket }}/relay/relay.tar.gz"
          id=$(aws ssm send-command --document-name airband-relay-deploy --targets Key=tag:Name,Values=airband-relay --query Command.CommandId --output text)
          for i in $(seq 1 60); do
            sleep 5
            status=$(aws ssm list-command-invocations --command-id "$id" --query 'CommandInvocations[0].Status' --output text)
            case "$status" in Success|Failed|TimedOut|Cancelled) break;; esac
          done
          aws ssm list-command-invocations --command-id "$id" --details --query 'CommandInvocations[0].CommandPlugins[0].Output' --output text
          echo "the server says: $status"; [ "$status" = Success ]
      - name: Check the live relay answers
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://relay.airband.dev/healthz || true)
            echo "attempt $i: $code"; [ "$code" = "200" ] && exit 0; sleep 5
          done
          exit 1
      - name: Record this commit as the relay deployed
        # only forward: a run for an older commit (a hand run on an older ref) never moves the record back
        run: |
          set +e; git ls-remote --exit-code --tags origin refs/tags/relay-deployed > /dev/null; there=$?; set -e
          if [ "$there" = 0 ]; then
            git fetch --no-tags --force origin refs/tags/relay-deployed:refs/tags/relay-deployed
            git merge-base --is-ancestor relay-deployed HEAD || { echo "the recorded deploy is not behind this commit; left as it is"; exit 0; }
          elif [ "$there" != 2 ]; then exit 1; fi
          git tag --force relay-deployed HEAD
          git push --force origin refs/tags/relay-deployed
  tokyo:
    if: ${{ inputs.tokyo }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: aws-actions/configure-aws-credentials@v4
        with: { role-to-assume: '${{ vars.AWS_DEPLOY_ROLE_ARN }}', aws-region: ap-northeast-1 }
      - name: Deploy
        working-directory: infra
        env: { AIRBAND_INFRA: '${{ secrets.AIRBAND_INFRA }}', AIRBAND_APNS: '${{ vars.AIRBAND_APNS }}' }
        run: npm ci --no-audit --no-fund && npx cdk deploy AirbandRelay --require-approval never
