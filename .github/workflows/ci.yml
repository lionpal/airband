name: CI
# Build and test on every system the tower is meant to run on, check the phone builds, and run the end-to-end
# suites that need no model: on every push, once a day, and whenever asked for. The repository is public, so
# the minutes cost nothing. The suite that needs a model (tools/e2e.py) runs on the computer a push comes from.
on:
  push:
    branches: [main]
    paths: ['crates/**', 'catalog/**', 'apps/**', 'scripts/**', 'tools/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/ci.yml']
  schedule:
    - cron: '17 9 * * *'
  pull_request:
  workflow_dispatch:
concurrency: { group: 'ci-${{ github.ref }}', cancel-in-progress: true }
permissions: { contents: read }
jobs:
  test:
    name: Test on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, windows-latest, macos-latest] }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --release
      - run: cargo test --workspace
      - name: Lints, with every rule in clippy.toml
        if: matrix.os == 'macos-latest'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Core reaches neither files nor the network
        if: matrix.os == 'ubuntu-latest'
        run: |
          if cargo tree -p airband-core -e normal --prefix none | grep -qiE '^(ureq|reqwest|hyper) '; then echo "airband-core depends on an HTTP client"; exit 1; fi
          if grep -rnE 'std::fs|use std::fs|\bfs::' crates/airband-core/src; then echo "airband-core touches files"; exit 1; fi
  e2e:
    name: End to end (relay, held agents)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p airband-cli -p airband-relay
      - name: What he says while the computer is away is kept by the relay and delivered
        run: python3 tools/e2e-relay.py
      - name: The built tower against the built relay, for the pull itself (two towers, a restart, kept words)
        run: python3 tools/e2e-pull.py
      - name: Agents the tower runs itself, with a stand-in for the agent
        run: python3 tools/e2e-held.py
      - name: Things an agent made, end to end
        run: python3 tools/e2e-links.py
  android:
    name: Radio core for Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-linux-android }
      - uses: Swatinem/rust-cache@v2
      - name: Build the radio library for Android
        run: |
          TOOLS="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$TOOLS/aarch64-linux-android24-clang" AR_aarch64_linux_android="$TOOLS/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TOOLS/aarch64-linux-android24-clang"
          cargo build --release -p airband-radio --target aarch64-linux-android
  iphone:
    name: iPhone app
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        # the device's, and the simulator's: scripts/build-apple.sh builds the radio core for both
        with: { targets: 'aarch64-apple-ios,aarch64-apple-ios-sim' }
      - uses: Swatinem/rust-cache@v2
      - run: brew install xcodegen
      - name: Build the radio core, generate the Swift module, compile and link the app (unsigned)
        run: scripts/build-apple.sh --device
