name: Release
# Builds the `airband` command for macOS and Linux and publishes it where anyone can download it:
#   https://airband.dev/releases/<version>/airband-<version>-<target>.tar.gz   (and the same name with .sha256)
#   https://airband.dev/releases/latest.json                                    ({"version": "<version>"})
# This repository is private, so its own release assets cannot be downloaded without signing in. The files go in
# the homepage's bucket under releases/, which the site's deploy leaves alone (see `exclude` in infra/cdk.mjs).
# The Homebrew tap (github.com/airband-dev/homebrew-airband) reads latest.json and the checksums and updates its
# formula by itself.
#
# To release: change the version in Cargo.toml, push to main, then run this by hand from main (Actions tab,
# "Run workflow", or `gh workflow run release.yml`). It must run from main: the AWS role trusts no other ref.
# A file that is already published is never replaced, because the formula pins its checksum. To publish a
# different build, release a new version.
#
# If GitHub has no macOS runner to give, run it with "skip macOS" ticked and publish the two Mac files by hand
# from a Mac:  scripts/package.sh aarch64-apple-darwin x86_64-apple-darwin, then copy dist/* to
# s3://<the site's bucket>/releases/<version>/ with the same cache-control as below.
on:
  workflow_dispatch:
    inputs:
      skip_macos:
        description: 'Skip the macOS builds (publish them by hand)'
        type: boolean
        default: false
concurrency: { group: release, cancel-in-progress: false }
permissions: { contents: read }
jobs:
  linux:
    name: Build for ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # the oldest Ubuntu on offer, so the binary runs wherever glibc is 2.35 or newer
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: '${{ matrix.target }}' }
      - run: scripts/package.sh ${{ matrix.target }}
      - name: Check the binary says its version
        run: |
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP" airband
          "$RUNNER_TEMP/airband" --version
      - uses: actions/upload-artifact@v4
        with: { name: 'dist-${{ matrix.target }}', path: dist/, if-no-files-found: error }
  macos:
    name: Build for macOS (Apple silicon and Intel)
    if: ${{ !inputs.skip_macos }}
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: 'aarch64-apple-darwin,x86_64-apple-darwin' }
      - run: scripts/package.sh aarch64-apple-darwin x86_64-apple-darwin
      - name: Check the binary says its version
        run: |
          tar -xzf dist/airband-*-aarch64-apple-darwin.tar.gz -C "$RUNNER_TEMP" airband
          "$RUNNER_TEMP/airband" --version
      - uses: actions/upload-artifact@v4
        with: { name: dist-macos, path: dist/, if-no-files-found: error }
  publish:
    name: Publish to airband.dev/releases
    needs: [linux, macos]
    if: ${{ !cancelled() && needs.linux.result == 'success' && (needs.macos.result == 'success' || needs.macos.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: { id-token: write, contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: 'dist-*', path: dist, merge-multiple: true }
      - uses: aws-actions/configure-aws-credentials@v4
        with: { role-to-assume: '${{ vars.AWS_DEPLOY_ROLE_ARN }}', aws-region: us-east-1 }
      - name: Publish
        env: { BUCKET: '${{ secrets.RELEASES_BUCKET }}' }
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_ENV"
          ls -l dist
          for f in dist/*.tar.gz; do
            name=$(basename "$f")
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://airband.dev/releases/$version/$name")
            if [ "$code" = "200" ]; then echo "::notice::$name is already published and was left as it is"; continue; fi
            # the checksum first, so the tarball is never there without it
            aws s3 cp "$f.sha256" "s3://$BUCKET/releases/$version/$name.sha256" --content-type text/plain --cache-control 'public, max-age=300' --only-show-errors
            aws s3 cp "$f" "s3://$BUCKET/releases/$version/$name" --content-type application/gzip --cache-control 'public, max-age=31536000, immutable' --only-show-errors
            echo "published $name  $(cat "$f.sha256")"
          done
          printf '{"version": "%s"}\n' "$version" > latest.json
          aws s3 cp latest.json "s3://$BUCKET/releases/latest.json" --content-type application/json --cache-control 'public, max-age=60' --only-show-errors
      - name: Check each file downloads and matches its checksum
        run: |
          for f in dist/*.tar.gz; do
            name=$(basename "$f")
            want=$(curl -fsS "https://airband.dev/releases/$version/$name.sha256")
            got=$(curl -fsS "https://airband.dev/releases/$version/$name" | sha256sum | cut -d' ' -f1)
            echo "$name  $got"; [ "$got" = "$want" ]
          done
          curl -fsS https://airband.dev/releases/latest.json
      - name: Tag the commit
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then echo "v$version is already tagged"; exit 0; fi
          git tag "v$version" && git push origin "v$version"
