name: Release
# Builds the `airband` command for macOS and Linux and publishes it where anyone can download it:
#   https://airband.dev/releases/<version>/airband-<version>-<target>.tar.gz    the binary, for anyone
#   https://airband.dev/releases/<version>/airband-<version>.<tag>.bottle.tar.gz   the same, as Homebrew wants it
#   (each with its checksum at the same address plus .sha256)
#   https://airband.dev/releases/latest.json                                    ({"version": "<version>"})
# The files are served from airband.dev, so an install does not depend on GitHub. They go in
# the homepage's bucket under releases/, which the site's deploy leaves alone (see `exclude` in infra/cdk.mjs).
# The Homebrew tap (github.com/lionpal/homebrew-airband) reads latest.json and the checksums and updates its
# formula by itself.
#
# To release: change the version in Cargo.toml, push to main, then run this by hand from main (Actions tab,
# "Run workflow", or `gh workflow run release.yml`). It must run from main: the AWS role trusts no other ref.
# A file that is already published is never replaced, because the formula pins its checksum. To publish a
# different build, release a new version.
#
# Every release is eight files, two for each system (scripts/release-files.sh lists them), and latest.json is
# written only once all eight are served from airband.dev and each matches its checksum
# (scripts/check-release.sh --all). The tap updates its formula from latest.json, so it is never pointed at a
# release with a file missing. In 0.9.5 the Mac's two binaries were published by hand and its two bottles were
# not, latest.json was written all the same, and the tap's update failed for hours without anyone seeing it.
#
# The Mac's files are never built here: a GitHub runner has no Developer ID certificate, so they would go out
# unsigned (0.9.6 did). The workflow publishes the Linux files and stops before latest.json, naming the Mac files
# that are missing. Publish those from the Mac that holds the certificate:
#   scripts/package.sh aarch64-apple-darwin x86_64-apple-darwin
#   BUCKET=<the site's bucket> scripts/publish-mac.sh
# (it refuses a binary not signed with the Developer ID certificate; all four of the Mac's files, each checksum
# first, then each checked as served), then run this again: it finds every file published and names the version.
#
# 0.1.1 was published by hand, all four systems, because Actions was not running jobs for this account that day
# (a billing notice). The Linux binaries were built in a Debian 12 container.
on:
  workflow_dispatch:
concurrency: { group: release, cancel-in-progress: false }
permissions: { contents: read }
jobs:
  linux:
    name: Build for ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # the oldest Ubuntu on offer, so the binary runs wherever glibc is 2.35 or newer
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: '${{ matrix.target }}' }
      - run: scripts/package.sh ${{ matrix.target }}
      - name: Check the binary says its version
        run: |
          tar -xzf dist/airband-*-${{ matrix.target }}.tar.gz -C "$RUNNER_TEMP" airband
          "$RUNNER_TEMP/airband" --version
      - uses: actions/upload-artifact@v4
        with: { name: 'dist-${{ matrix.target }}', path: dist/, if-no-files-found: error }
  publish:
    name: Publish to airband.dev/releases
    needs: [linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: { id-token: write, contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: 'dist-*', path: dist, merge-multiple: true }
      - uses: aws-actions/configure-aws-credentials@v4
        with: { role-to-assume: '${{ vars.AWS_DEPLOY_ROLE_ARN }}', aws-region: us-east-1 }
      - name: Publish what was built
        env: { BUCKET: '${{ secrets.RELEASES_BUCKET }}' }
        run: |
          version=$(scripts/version.sh)
          echo "version=$version" >> "$GITHUB_ENV"
          ls -l dist
          scripts/publish-release.sh x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu
      # latest.json names a version only once every file of it is served, the Mac's too, which are published from a
      # Mac: the tap updates from it and would fail on a file that is not there
      - name: Check every file of the release is served and matches its checksum
        run: scripts/check-release.sh --all
      - name: Name it the latest
        env: { BUCKET: '${{ secrets.RELEASES_BUCKET }}' }
        run: |
          printf '{"version": "%s"}\n' "$version" > latest.json
          aws s3 cp latest.json "s3://$BUCKET/releases/latest.json" --content-type application/json --cache-control 'public, max-age=60' --only-show-errors
          curl -fsS https://airband.dev/releases/latest.json
      - name: Tag the commit
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then echo "v$version is already tagged"; exit 0; fi
          git tag "v$version" && git push origin "v$version"
