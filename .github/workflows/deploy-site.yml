name: Deploy airband.dev
# The homepage: one static page (site/index.html) behind a CDN. It deploys by itself, on a change to the page or
# to the infrastructure, and never touches the relay: a copy change must not drop anyone's phone.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'infra/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:
concurrency: { group: deploy-site, cancel-in-progress: false }
permissions: { id-token: write, contents: read }
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: aws-actions/configure-aws-credentials@v4
        with: { role-to-assume: '${{ vars.AWS_DEPLOY_ROLE_ARN }}', aws-region: us-east-1 }
      - name: Deploy
        working-directory: infra
        env: { AIRBAND_INFRA: '${{ secrets.AIRBAND_INFRA }}' }
        run: npm ci --no-audit --no-fund && npx cdk deploy AirbandSite --require-approval never
      - name: Check the live page is the one in this commit
        # the same bytes: the page served is compared whole, by its hash, with the one in this commit
        run: |
          want=$(sha256sum site/index.html | cut -d' ' -f1)
          for i in $(seq 1 20); do
            got=$(curl -sf https://airband.dev/ | sha256sum | cut -d' ' -f1 || true)
            echo "attempt $i: $got"; [ "$got" = "$want" ] && exit 0; sleep 15
          done
          exit 1
