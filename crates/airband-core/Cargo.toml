[package]
name = "airband-core"
description = "Every rule the tower, the relay and the radio share: the protocols' types, callsigns, what an utterance means, what can be said aloud, and the relay's encryption"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
getrandom = "0.3"
base64 = "0.22"
url = "2"
# what an agent wrote, read as the markdown it is (prose.rs)
pulldown-cmark = { version = "0.13", default-features = false }
linkify = "0.10"
# the phone core builds these types for Swift
uniffi = { workspace = true, optional = true }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }

[build-dependencies]
serde_json.workspace = true
sha2 = "0.10"

[features]
# the types a phone sees through the phone core (prose.rs), made for Swift
ffi = ["dep:uniffi"]
