[package]
name = "airband-cli"
description = "The tower daemon, the Claude Code hook, the installer and a terminal radio, in one command"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
airband-core = { path = "../airband-core" }
airband-radio = { path = "../airband-radio" }
serde.workspace = true
serde_json.workspace = true
ureq.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "time", "sync", "io-util"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
if-addrs = "0.13"
getrandom = "0.3"
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
tower = { version = "0.5", features = ["util"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
qrcode = { version = "0.14", default-features = false }
base64 = "0.22"

# A voice that runs on this computer, with no key: Gradium's Phonon. Its model is fetched the first time it is
# chosen. Leave the feature out (`--no-default-features`) for a tower that should not carry it.
ptts = { version = "0.7.1", features = ["hf", "hub"], optional = true }

[features]
default = ["phonon"]
phonon = ["dep:ptts"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[[bin]]
name = "airband"
path = "src/main.rs"
