[package]
name = "airband-cli"
description = "The tower daemon, the Claude Code hook, the installer and a terminal radio, in one command"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
infer = { version = "0.19", default-features = false, features = ["std"] }
airband-core = { path = "../airband-core" }
airband-io = { path = "../airband-io" }
# the terminal radio; the phone's own voice model is left out of this program
airband-radio = { path = "../airband-radio", default-features = false }
serde.workspace = true
serde_json.workspace = true
ureq.workspace = true
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "time", "sync", "io-util"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
if-addrs = "0.13"
getrandom = "0.3"
sha2 = "0.10"
# the keys at rest, where there is no keychain to hold them
chacha20poly1305 = "0.10"
hkdf = "0.12"
rusqlite = { version = "0.32", features = ["bundled"] }
tower = { version = "0.5", features = ["util"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
qrcode = { version = "0.14", default-features = false }


[target.'cfg(unix)'.dependencies]
libc = "0.2"
# Codex's own server on this computer is spoken to over a socket file, as a websocket
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[[bin]]
name = "airband"
path = "src/main.rs"
