[package]
name = "airband-radio"
description = "The radio: the whole phone-side conversation loop. A host app only speaks text and listens for speech."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
airband-core = { path = "../airband-core" }
serde.workspace = true
serde_json.workspace = true
ureq.workspace = true
uniffi.workspace = true
getrandom = "0.3"
# speech to text as he speaks: one WebSocket to the listening service, over the TLS already used for everything else
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
# a voice made on the phone itself: the program is here, its model is fetched when he asks for it
ptts = { version = "0.7.1", features = ["hf"], optional = true }

[features]
default = ["phonon"]
phonon = ["dep:ptts"]
