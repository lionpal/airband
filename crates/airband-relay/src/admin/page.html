<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/admin/admin.css">
<script src="/admin/admin.js" defer></script>
</head>
<body>
<main id="gate" class="gate" hidden>
  <form id="signin" class="card" novalidate>
    <svg class="logo" width="40" height="40" viewBox="0 0 512 512" aria-hidden="true"><g transform="translate(256 350) scale(0.88)"><g fill="none" stroke="#3DDC97" stroke-width="40" stroke-linecap="round"><path d="M-93.3 -93.3 A132 132 0 0 1 93.3 -93.3"/><path d="M-151.3 -151.3 A214 214 0 0 1 151.3 -151.3"/><path d="M-209.3 -209.3 A296 296 0 0 1 209.3 -209.3"/></g><g transform="scale(0.82)" fill="#F4F4F0"><path d="M0 -92 C10 -92 14 -70 14 -50 L14 70 C14 82 8 90 0 92 C-8 90 -14 82 -14 70 L-14 -50 C-14 -70 -10 -92 0 -92 Z"/><path d="M0 -40 L96 20 L96 36 L0 8 L-96 36 L-96 20 Z"/><path d="M0 54 L40 84 L40 94 L0 82 L-40 94 L-40 84 Z"/></g></g></svg>
    <div class="caption">Admin</div>
    <label>Email<input id="email" name="email" type="email" autocomplete="username" required autofocus></label>
    <label>Password<input id="password" name="password" type="password" autocomplete="current-password" required></label>
    <p id="signinmsg" class="error" role="status" aria-live="polite"></p>
    <button type="submit" id="signinbtn" class="primary">Sign in</button>
  </form>
</main>

<main id="list" class="page" hidden>
  <header>
    <div>
      <h1>Requests</h1>
      <p id="note" class="note"></p>
    </div>
    <button type="button" id="signout" class="quiet">Sign out</button>
  </header>
  <div class="bar">
    <button type="button" id="sendchosen" class="primary" disabled>Send invites</button>
    <p id="listmsg" class="error" role="status" aria-live="polite"></p>
  </div>
  <div class="table">
    <table>
      <thead>
        <tr><th class="pick"><input type="checkbox" id="pickall" aria-label="Choose everyone waiting"></th><th>Email</th><th>Asked</th><th>Invite</th><th></th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</main>
</body>
</html>
