[package]
name = "airband-relay"
description = "The relay: passes sealed messages between radios and towers, and can read none of them"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
airband-core = { path = "../airband-core" }
airband-io = { path = "../airband-io" }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tokio-postgres = "0.7"
tokio-postgres-rustls = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
# push notifications: Apple's service takes HTTP/2 only, and a pass signed with the key it issued (ES256)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "http2", "json"] }
ring = "0.17"
