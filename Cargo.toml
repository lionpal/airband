[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.9.7"
edition = "2024"
publish = false
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
ureq = { version = "3", default-features = false, features = ["json", "rustls"] }
uniffi = "0.32.2"

[profile.release]
opt-level = "s"
lto = true
