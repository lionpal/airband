# Files and the network are reached through airband-io, so a damaged file is handled one way and core never
# touches either. A module that must still reach them directly says so at its top with `#![expect(..., reason)]`,
# so one that no longer needs to fails the lint.
disallowed-methods = [
  { path = "std::fs::write", reason = "write through airband_io::files (atomic, kept policy)" },
  { path = "std::fs::read", reason = "read through airband_io" },
  { path = "std::fs::read_to_string", reason = "read through airband_io" },
  { path = "std::fs::rename", reason = "move files through airband_io" },
  { path = "std::fs::remove_file", reason = "remove files through airband_io" },
  { path = "std::fs::create_dir_all", reason = "make folders through airband_io" },
  { path = "std::fs::read_dir", reason = "list a folder through airband_io::files::entries" },
  { path = "std::fs::remove_dir_all", reason = "remove folders through airband_io::files::remove_folder" },
  { path = "std::fs::File::open", reason = "open files through airband_io" },
  { path = "std::fs::File::create", reason = "write files through airband_io::files" },
  { path = "std::fs::create_dir", reason = "make folders through airband_io" },
  { path = "std::fs::OpenOptions::new", reason = "open files through airband_io" },
  { path = "std::fs::File::options", reason = "open files through airband_io" },
  { path = "std::fs::copy", reason = "copy files through airband_io::files::copy" },
  { path = "std::fs::canonicalize", reason = "follow links through airband_io::files::real_path" },
  { path = "std::path::Path::canonicalize", reason = "follow links through airband_io::files::real_path" },
  { path = "std::fs::metadata", reason = "read what is recorded of a file through airband_io::files::metadata" },
  { path = "std::path::Path::metadata", reason = "read what is recorded of a file through airband_io::files::metadata" },
  { path = "std::fs::symlink_metadata", reason = "read what is recorded of a link through airband_io::files::link_metadata" },
  { path = "std::path::Path::symlink_metadata", reason = "read what is recorded of a link through airband_io::files::link_metadata" },
  { path = "std::fs::set_permissions", reason = "set who may read a file through airband_io::files::set_mode" },
  { path = "ureq::Agent::put", reason = "reach the network through airband_io::http" },
  { path = "ureq::Agent::delete", reason = "reach the network through airband_io::http" },
  { path = "ureq::Agent::get", reason = "reach the network through airband_io::http" },
  { path = "ureq::Agent::post", reason = "reach the network through airband_io::http" },
  { path = "ureq::Agent::patch", reason = "reach the network through airband_io::http" },
  { path = "ureq::Agent::head", reason = "reach the network through airband_io::http" },
  { path = "ureq::Agent::config_builder", reason = "make a client through airband_io::http::Client" },
  { path = "ureq::Agent::new_with_defaults", reason = "make a client through airband_io::http::Client" },
  { path = "ureq::Agent::new_with_config", reason = "make a client through airband_io::http::Client" },
  { path = "std::process::Command::new", reason = "start a program through airband_io::child::command, which hands it only its standard streams" },
  { path = "tokio::process::Command::new", reason = "start a program through airband_io::child::command (tokio::process::Command::from it)" },
  { path = "ureq::get", reason = "reach the network through airband_io::http" },
  { path = "ureq::post", reason = "reach the network through airband_io::http" },
  { path = "ureq::put", reason = "reach the network through airband_io::http" },
  { path = "ureq::delete", reason = "reach the network through airband_io::http" },
  { path = "ureq::patch", reason = "reach the network through airband_io::http" },
  { path = "ureq::head", reason = "reach the network through airband_io::http" },
  { path = "ureq::options", reason = "reach the network through airband_io::http" },
  { path = "ureq::connect", reason = "reach the network through airband_io::http" },
  { path = "ureq::trace", reason = "reach the network through airband_io::http" },
  { path = "ureq::run", reason = "reach the network through airband_io::http" },
  { path = "ureq::agent", reason = "make a client through airband_io::http::Client" },
  { path = "ureq::Agent::options", reason = "reach the network through airband_io::http" },
  { path = "ureq::Agent::connect", reason = "reach the network through airband_io::http" },
  { path = "ureq::Agent::trace", reason = "reach the network through airband_io::http" },
  { path = "ureq::Agent::run", reason = "reach the network through airband_io::http" },
  { path = "ureq::Agent::with_parts", reason = "make a client through airband_io::http::Client" },
  { path = "ureq::Agent::configure_request", reason = "reach the network through airband_io::http" },
  { path = "ureq::config::Config::builder", reason = "make a client through airband_io::http::Client" },
  { path = "ureq::config::Config::new_agent", reason = "make a client through airband_io::http::Client" },
  { path = "ureq::RequestExt::with_default_agent", reason = "reach the network through airband_io::http" },
  { path = "ureq::RequestExt::with_agent", reason = "reach the network through airband_io::http" },
]
# a client, or what it is made from, held anywhere but airband_io::http
disallowed-types = [
  { path = "ureq::Agent", reason = "make a client through airband_io::http::Client" },
  { path = "ureq::config::Config", reason = "make a client through airband_io::http::Client" },
  { path = "ureq::Body", reason = "read an answer through airband_io::http::Body" },
  { path = "ureq::Error", reason = "a request's failure is airband_io::http::Error" },
]
disallowed-macros = [
  { path = "serde_json::json", reason = "wire and file bodies are typed; build them from their types" },
]
